<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050505">
  <meta name="wavero-build" content="1.0.3-yandex">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Wavero</title>
  <style>
    :root{
      --bg:#050505;--panel:#0c0c0c;--panel-2:#121212;--panel-3:#181818;--line:#292929;
      --text:#f7f7f5;--muted:#8d8d88;--soft:#c8c8c3;--accent:#fff;--accent-text:#050505;
      --danger:#ff6c6c;--success:#77d58b;--shadow:0 24px 90px rgba(0,0,0,.38);
      --app-height:100dvh;--radius:18px;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body.light{--bg:#f3f3f0;--panel:#fff;--panel-2:#f7f7f4;--panel-3:#ecece8;--line:#deded8;--text:#111;--muted:#74746f;--soft:#333;--accent:#111;--accent-text:#fff;--shadow:0 24px 70px rgba(0,0,0,.13)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;-webkit-text-size-adjust:100%}
    body{background:var(--bg);color:var(--text);overflow:hidden;max-width:100vw}
    button,input,textarea,select{font:inherit}
    button{touch-action:manipulation}
    .hidden{display:none!important}
    .screen{position:fixed;inset:0;width:100%;height:var(--app-height);min-height:0}
    .auth-screen{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,520px);background:var(--bg);overflow:auto;overflow-x:hidden}
    .auth-hero{position:relative;min-width:0;min-height:100%;padding:clamp(32px,5vw,76px);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);overflow:hidden}
    .auth-hero:after{content:"";position:absolute;right:-180px;bottom:-220px;width:540px;height:540px;border:1px solid var(--line);border-radius:50%;box-shadow:0 0 0 76px var(--bg),0 0 0 77px var(--line),0 0 0 152px var(--bg)}
    .brand{font-size:26px;font-weight:800;letter-spacing:-.05em;position:relative;z-index:1}
    .hero-copy{position:relative;z-index:1;max-width:760px;min-width:0}
    .eyebrow{text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-size:11px;margin-bottom:18px}
    h1{font-size:clamp(50px,7vw,108px);line-height:.88;letter-spacing:-.075em;margin:0;font-weight:650;max-width:100%;overflow-wrap:normal}
    .hero-copy p{color:var(--muted);font-size:17px;line-height:1.65;max-width:540px;margin:30px 0 0}
    .auth-foot{position:relative;z-index:1;color:var(--muted);font-size:12px}
    .auth-panel{background:var(--panel);display:flex;align-items:center;padding:clamp(24px,5vw,64px);min-height:100%;min-width:0;overflow:auto}
    .auth-card{width:100%;max-width:420px;margin:auto}
    .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:30px}
    .tab{border:0;background:none;color:var(--muted);padding:0 0 14px;cursor:pointer;font-weight:700;position:relative}
    .tab.active{color:var(--text)}
    .tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--text)}
    form{display:grid;gap:16px}
    label{display:grid;gap:7px;color:var(--muted);font-size:12px}
    input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:14px 15px;outline:none;min-width:0}
    input:focus,textarea:focus,select:focus{border-color:var(--muted)}
    textarea{resize:vertical;min-height:100px}
    .primary,.secondary,.danger-btn,.icon-btn,.chip-btn{border-radius:12px;cursor:pointer;transition:.16s ease}
    .primary{border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);padding:14px 18px;font-weight:800}
    .secondary{border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 15px;font-weight:700}
    .danger-btn{border:1px solid color-mix(in srgb,var(--danger) 55%,var(--line));background:transparent;color:var(--danger);padding:12px 15px;font-weight:700}
    .primary:active,.secondary:active,.danger-btn:active,.icon-btn:active,.chip-btn:active{transform:scale(.97)}
    button:disabled{opacity:.45;cursor:wait}
    .link-btn{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;text-align:left;width:max-content}
    .notice{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 15px;margin-bottom:18px;display:none}
    .notice.show{display:block}.notice.error{border-color:color-mix(in srgb,var(--danger) 60%,var(--line));color:var(--danger)}.notice.ok{color:var(--success)}
    .yandex-btn{width:100%;min-height:50px;border:1px solid var(--line);background:var(--text);color:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;cursor:pointer;margin-bottom:16px;touch-action:manipulation}
    .yandex-btn:active{transform:scale(.98)}.yandex-mark{width:26px;height:26px;border-radius:8px;background:#fc3f1d;color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;line-height:1}
    .auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:0 0 16px}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}
    .field-error{color:var(--danger);font-size:11px;min-height:0}
    .app{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);background:var(--bg);overflow:hidden}
    .sidebar,.chat-view{min-height:0;height:100%;overflow:hidden}
    .sidebar{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
    .side-head{padding:calc(12px + var(--safe-top)) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:0 0 auto}
    .side-brand{font-size:22px;font-weight:850;letter-spacing:-.05em;flex:1}
    .icon-btn{width:42px;height:42px;border:1px solid var(--line);background:transparent;color:var(--text);display:grid;place-items:center;font-size:18px}
    .side-search{padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
    .side-search input{background:var(--panel-2);padding:11px 13px}
    .chat-list{flex:1;min-height:0;overflow:auto;padding:8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .chat-row{width:100%;border:0;background:transparent;color:var(--text);padding:11px;border-radius:15px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;text-align:left;cursor:pointer}
    .chat-row:hover,.chat-row.active{background:var(--panel-2)}
    .avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:850;overflow:hidden;flex:0 0 auto}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .chat-copy{min-width:0}.chat-title{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
    .chat-meta{text-align:right;display:grid;justify-items:end;gap:5px}.chat-time{font-size:10px;color:var(--muted)}.badge{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--accent-text);font-size:10px;font-weight:850;display:grid;place-items:center;padding:0 6px}
    .side-foot{padding:10px 12px calc(10px + var(--safe-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex:0 0 auto}
    .side-foot button{flex:1}
    .chat-view{display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
    .chat-head{min-height:66px;padding:calc(8px + var(--safe-top)) 14px 8px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .mobile-back{display:none}.chat-head-copy{min-width:0;flex:1}.chat-head-title{font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-head-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-actions{display:flex;gap:8px}
    .messages-wrap{position:relative;min-height:0;overflow:hidden}
    .messages{height:100%;min-height:0;overflow:auto;padding:22px clamp(14px,4vw,52px);display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .messages-status{position:absolute;inset:0;z-index:8;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--bg);padding:22px}.messages-status.hidden{display:none!important}
    .bubble{max-width:min(720px,84%);align-self:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
    .bubble.mine{align-self:flex-end;background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
    .bubble-author{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.bubble.mine .bubble-author{display:none}
    .reply-preview{border-left:2px solid currentColor;padding:5px 8px;margin-bottom:7px;opacity:.62;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .bubble-text{white-space:pre-wrap;word-break:break-word;line-height:1.45}
    .bubble-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:6px;font-size:9px;opacity:.55}.pin-mark{font-size:11px}.message-menu{border:0;background:transparent;color:inherit;padding:0 2px;cursor:pointer;font-size:16px;line-height:1}
    .reactions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.reaction{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 7px;font-size:11px;opacity:.75;cursor:pointer}.reaction.mine{opacity:1;font-weight:800}
    .composer-shell{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + var(--safe-bottom));flex:0 0 auto}
    .reply-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:7px;background:var(--panel-2);border-radius:11px;font-size:11px;color:var(--muted)}.reply-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .composer{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px}.composer textarea{min-height:46px;max-height:132px;resize:none;padding:12px 13px;background:var(--bg);font-size:16px}.send{width:46px;height:46px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);font-size:20px;cursor:pointer}
    .empty-list{color:var(--muted);padding:24px;text-align:center;font-size:13px}
    .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:16px;padding-top:calc(16px + var(--safe-top));padding-bottom:calc(16px + var(--safe-bottom))}
    .modal-card{width:min(620px,100%);max-height:100%;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
    .modal-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.modal-title{font-weight:820;flex:1}.modal-body{padding:16px;overflow:auto;min-height:0}.modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.modal-body h3{margin:6px 0 12px}.modal-body p{color:var(--muted);line-height:1.55}
    .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:15px;padding:18px 12px;cursor:pointer;text-align:center;font-weight:750}.choice span{display:block;font-size:24px;margin-bottom:8px}
    .result-list{display:grid;gap:5px;margin-top:12px}.result-row{border:0;background:transparent;color:var(--text);border-radius:13px;padding:10px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;cursor:pointer}.result-row:hover{background:var(--panel-2)}.result-row .avatar{width:42px;height:42px}.result-name{font-weight:750}.result-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .form-grid{display:grid;gap:14px}.inline{display:flex;gap:9px;align-items:center}.inline>*{min-width:0}.inline .grow{flex:1}.check{display:flex;gap:9px;align-items:center;color:var(--text);font-size:13px}.check input{width:18px;height:18px;padding:0}
    .section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.member-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0}.member-actions{display:flex;gap:6px;align-items:center}.member-actions select{padding:8px;width:auto}.chip-btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 9px;font-size:11px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--bg)}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--muted)}
    .admin-table{display:grid;gap:7px}.admin-row{border:1px solid var(--line);border-radius:14px;padding:11px;background:var(--bg)}.admin-row-head{display:flex;gap:8px;align-items:center}.admin-row-head strong{flex:1}.admin-row small{color:var(--muted)}.admin-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.admin-actions select{width:auto;padding:8px}.admin-actions button{padding:8px 10px}
    .toast-stack{position:fixed;right:14px;bottom:calc(14px + var(--safe-bottom));z-index:100;display:grid;gap:8px;pointer-events:none}.toast{max-width:min(420px,calc(100vw - 28px));padding:12px 14px;border-radius:13px;background:var(--accent);color:var(--accent-text);box-shadow:var(--shadow);font-size:12px;line-height:1.45}.toast.error{background:var(--danger);color:#fff}
    @media(max-width:1180px){
      .auth-screen{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);overflow:auto;overflow-x:hidden}
      .auth-hero{min-height:0;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:calc(16px + var(--safe-top)) 24px 16px;display:block}
      .auth-hero:after,.hero-copy,.auth-foot{display:none}
      .brand{font-size:24px}
      .auth-panel{min-height:0;align-items:flex-start;padding:28px 20px calc(28px + var(--safe-bottom));overflow:visible}
      .auth-card{max-width:520px;margin:0 auto}
    }
    @media(max-width:800px){
      .app{grid-template-columns:1fr}.chat-view{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat-view{display:grid}.mobile-back{display:grid}.head-actions .optional-mobile{display:none}
      .messages{padding:14px 10px}.bubble{max-width:90%}.side-head{min-height:62px}.chat-head{min-height:62px}.composer-shell{padding-left:8px;padding-right:8px}.composer textarea{font-size:16px}
      .modal{padding:0;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);align-items:end}.modal-card{width:100%;max-height:94%;border-radius:22px 22px 0 0;border-bottom:0}.choice-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:480px){
      .auth-hero{padding-left:16px;padding-right:16px}.auth-panel{padding:20px 14px calc(20px + var(--safe-bottom))}.tabs{margin-bottom:22px}.primary{min-height:48px}
    }
    @media(max-height:700px){
      .auth-screen{display:block;overflow:auto}.auth-hero{display:none}.auth-panel{min-height:var(--app-height);padding-top:calc(14px + var(--safe-top));padding-bottom:calc(14px + var(--safe-bottom));align-items:flex-start}.auth-card{margin:0 auto}
    }
    @media(max-height:590px){.side-head,.chat-head{min-height:54px}.chat-head{padding-top:4px}.messages{padding-top:8px;padding-bottom:8px}.composer-shell{padding-top:5px;padding-bottom:calc(5px + var(--safe-bottom))}.composer textarea{min-height:42px}.send{height:42px}.modal-card{max-height:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <section id="authScreen" class="screen auth-screen">
    <div class="auth-hero">
      <div class="brand">Wavero</div>
      <div class="hero-copy"><div class="eyebrow">Личные сообщения · группы · каналы</div><h1>Общение<br>без шума.</h1><p>Быстрый мессенджер с единым аккаунтом, удобным поиском и адаптацией под любой экран.</p></div>
      <div class="auth-foot">Wavero 1.0.3</div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <div class="tabs"><button id="loginTab" class="tab active">Вход</button><button id="registerTab" class="tab">Регистрация</button></div>
        <div id="authNotice" class="notice"></div>
        <button id="yandexLoginBtn" class="yandex-btn" type="button"><span class="yandex-mark">Я</span><span>Продолжить через Яндекс</span></button>
        <div class="auth-divider"><span>или</span></div>
        <form id="loginForm" novalidate>
          <label>Почта или username<input id="loginIdentifier" autocomplete="username" placeholder="email или username"></label>
          <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль"></label>
          <button id="loginBtn" class="primary">Войти</button>
          <button id="resetBtn" class="link-btn" type="button">Забыли пароль?</button>
        </form>
        <form id="registerForm" class="hidden" novalidate>
          <label>Имя<input id="regName" maxlength="50" autocomplete="name" placeholder="Как вас называть"><span id="regNameError" class="field-error"></span></label>
          <label>Username<input id="regUsername" maxlength="24" autocapitalize="none" spellcheck="false" placeholder="username"><span id="regUsernameError" class="field-error"></span></label>
          <label>Email<input id="regEmail" type="email" autocomplete="email" placeholder="name@example.com"><span id="regEmailError" class="field-error"></span></label>
          <label>Пароль<input id="regPassword" type="password" autocomplete="new-password" placeholder="Не менее 8 символов и одна цифра"><span id="regPasswordError" class="field-error"></span></label>
          <button id="registerBtn" class="primary">Создать аккаунт</button>
        </form>
      </div>
    </div>
  </section>

  <section id="appShell" class="screen app hidden">
    <aside class="sidebar">
      <header class="side-head"><div class="side-brand">Wavero</div><button id="newChatBtn" class="icon-btn" title="Новый чат">＋</button><button id="profileBtn" class="icon-btn" title="Профиль">◉</button></header>
      <div class="side-search"><input id="chatFilter" placeholder="Поиск по чатам"></div>
      <div id="chatList" class="chat-list"></div>
      <footer class="side-foot"><button id="adminBtn" class="secondary hidden">Админ</button><button id="logoutBtn" class="secondary">Выйти</button></footer>
    </aside>
    <main class="chat-view">
      <header class="chat-head"><button id="backBtn" class="icon-btn mobile-back">‹</button><div class="chat-head-copy"><div id="chatTitle" class="chat-head-title">Выберите чат</div><div id="chatSubtitle" class="chat-head-sub">Сообщения появятся здесь</div></div><div class="head-actions"><button id="messageSearchBtn" class="icon-btn optional-mobile" title="Поиск">⌕</button><button id="chatInfoBtn" class="icon-btn" title="Информация">⋯</button></div></header>
      <div class="messages-wrap"><div id="messages" class="messages"></div><div id="messagesStatus" class="messages-status">Выберите чат</div></div>
      <div id="composerShell" class="composer-shell hidden"><div id="replyBar" class="reply-bar hidden"><span id="replyText"></span><button id="cancelReply" class="chip-btn">Отмена</button></div><form id="composer" class="composer"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Сообщение"></textarea><button class="send" aria-label="Отправить">➤</button></form></div>
    </main>
  </section>

  <section id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><header class="modal-head"><div id="modalTitle" class="modal-title"></div><button id="modalClose" class="icon-btn">×</button></header><div id="modalBody" class="modal-body"></div><footer id="modalFoot" class="modal-foot hidden"></footer></div></section>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script>
    "use strict";
    const VERSION="1.0.3-yandex";const API=location.origin;const $=id=>document.getElementById(id);
    const state={token:null,refreshToken:null,authProvider:null,expiresAt:0,user:null,profile:null,chats:[],activeChat:null,messages:[],poll:null,messageSeq:0,replyTo:null,isAdmin:false};
    function syncViewport(){const h=window.visualViewport?.height||innerHeight||document.documentElement.clientHeight;document.documentElement.style.setProperty("--app-height",`${Math.max(260,Math.round(h))}px`)}
    syncViewport();addEventListener("resize",syncViewport,{passive:true});addEventListener("orientationchange",()=>setTimeout(syncViewport,80),{passive:true});window.visualViewport?.addEventListener("resize",syncViewport,{passive:true});
    function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
    function initial(v){return String(v||"?").trim().charAt(0).toUpperCase()||"?"}
    function formatTime(v){if(!v)return"";const d=new Date(v);const today=new Date();return d.toDateString()===today.toDateString()?d.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("ru",{day:"2-digit",month:"2-digit"})}
    function toast(text,type=""){const el=document.createElement("div");el.className=`toast ${type}`;el.textContent=text;$("toastStack").append(el);setTimeout(()=>el.remove(),3800)}
    function setNotice(text,type=""){const n=$("authNotice");n.textContent=text;n.className=`notice ${text?"show":""} ${type}`}

    $("chatInfoBtn").onclick=()=>state.activeChat?openChatInfo():toast("Сначала выберите чат");
    async function openChatInfo(){try{const d=await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}`);const c=d.chat;const manage=['owner','admin'].includes(c.role);const members=(d.members||[]).map(m=>`<div class="member-row"><div class="avatar">${initial(m.display_name||m.username)}</div><div><div class="result-name">${escapeHtml(m.display_name||m.username)}</div><div class="result-sub">@${escapeHtml(m.username)} · ${escapeHtml(m.role)}</div></div>${manage&&m.role!=="owner"?`<div class="member-actions"><select data-role-user="${escapeHtml(m.id)}"><option value="member" ${m.role==='member'?'selected':''}>Участник</option><option value="subscriber" ${m.role==='subscriber'?'selected':''}>Подписчик</option><option value="moderator" ${m.role==='moderator'?'selected':''}>Модератор</option><option value="admin" ${m.role==='admin'?'selected':''}>Админ</option></select><button class="chip-btn" data-remove-user="${escapeHtml(m.id)}">Удалить</button></div>`:`<span>${escapeHtml(m.role)}</span>`}</div>`).join("");const privateBlock=state.activeChat.type==='private'&&state.activeChat.peer_user_id?`<button id="blockPeer" class="danger-btn">Заблокировать пользователя</button>`:"";openModal("Информация о чате",`<div class="form-grid">${c.type!=='private'?`<label>Название<input id="infoTitle" value="${escapeHtml(c.title||"")}" ${manage?"":"disabled"}></label><label>Описание<textarea id="infoDescription" ${manage?"":"disabled"}>${escapeHtml(c.description||"")}</textarea></label><label>Username<input id="infoUsername" value="${escapeHtml(c.username||"")}" ${manage?"":"disabled"}></label><label class="check"><input id="infoPublic" type="checkbox" ${c.is_public?'checked':''} ${manage?"":"disabled"}>Публичный чат</label>${manage?`<button id="saveChatInfo" class="primary">Сохранить</button><div class="inline"><input id="addMemberUsername" class="grow" placeholder="username участника"><button id="addMemberBtn" class="secondary">Добавить</button></div><button id="inviteBtn" class="secondary">Создать ссылку-приглашение</button>`:""}`:""}${privateBlock}<div class="section"><h3>Участники</h3>${members||'<div class="empty-list">Нет участников</div>'}</div></div>`,()=>{if(manage&&$("saveChatInfo"))$("saveChatInfo").onclick=async()=>{try{await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}`,{method:"PATCH",body:{title:$("infoTitle").value,description:$("infoDescription").value,username:$("infoUsername").value,is_public:$("infoPublic").checked}});toast("Сохранено");closeModal();await reloadChats()}catch(err){toast(err.message,"error")}};if($("addMemberBtn"))$("addMemberBtn").onclick=async()=>{try{await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}/members`,{method:"POST",body:{username:$("addMemberUsername").value.trim()}});toast("Участник добавлен");openChatInfo()}catch(err){toast(err.message,"error")}};if($("inviteBtn"))$("inviteBtn").onclick=async()=>{try{const x=await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}/invites`,{method:"POST",body:{expires_in_hours:168}});await navigator.clipboard?.writeText(x.invite.url);toast(`Ссылка создана: ${x.invite.url}`)}catch(err){toast(err.message,"error")}};document.querySelectorAll("[data-role-user]").forEach(s=>s.onchange=async()=>{try{await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}/members/${encodeURIComponent(s.dataset.roleUser)}`,{method:"PATCH",body:{role:s.value}});toast("Роль обновлена")}catch(err){toast(err.message,"error")}});document.querySelectorAll("[data-remove-user]").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить участника?"))return;try{await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}/members/${encodeURIComponent(b.dataset.removeUser)}`,{method:"DELETE",body:{}});openChatInfo()}catch(err){toast(err.message,"error")}});if($("blockPeer"))$("blockPeer").onclick=async()=>{try{await api(`/api/me/blocks/${encodeURIComponent(state.activeChat.peer_user_id)}`,{method:"POST",body:{}});toast("Пользователь заблокирован");closeModal()}catch(err){toast(err.message,"error")}}})}catch(err){toast(err.message,"error")}}
    $("messageSearchBtn").onclick=()=>{if(!state.activeChat)return;openModal("Поиск в чате",`<input id="messageSearchInput" placeholder="Текст сообщения"><div id="messageSearchResults" class="result-list"></div>`,()=>{let t;$("messageSearchInput").oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=$("messageSearchInput").value.trim();if(q.length<2)return $("messageSearchResults").innerHTML="";try{const d=await api(`/api/chats/${encodeURIComponent(state.activeChat.id)}/search?q=${encodeURIComponent(q)}`);$("messageSearchResults").innerHTML=(d.messages||[]).map(m=>`<button class="result-row" data-found="${escapeHtml(m.id)}"><div class="avatar">${initial(m.sender_display_name)}</div><div><div class="result-name">${escapeHtml(m.sender_display_name||m.sender_username)}</div><div class="result-sub">${escapeHtml(m.text)}</div></div><span>${formatTime(m.created_at)}</span></button>`).join("")||`<div class="empty-list">Не найдено</div>`;document.querySelectorAll("[data-found]").forEach(b=>b.onclick=()=>{closeModal();document.getElementById(`msg-${b.dataset.found}`)?.scrollIntoView({behavior:"smooth",block:"center"})})}catch(err){toast(err.message,"error")}},250)}})};
    $("profileBtn").onclick=openProfile;
    function openProfile(){const p=state.profile||{};openModal("Профиль и настройки",`<form id="profileForm" class="form-grid"><label>Имя<input id="profileName" maxlength="50" value="${escapeHtml(state.user.display_name)}"></label><label>Username<input id="profileUsername" maxlength="24" value="${escapeHtml(state.user.username)}"></label><label>О себе<textarea id="profileBio" maxlength="280">${escapeHtml(p.bio||"")}</textarea></label><label>Ссылка на аватар<input id="profileAvatar" value="${escapeHtml(p.avatar_url||"")}" placeholder="https://..."></label><label>Тема<select id="profileTheme"><option value="dark" ${p.theme==='dark'?'selected':''}>Тёмная</option><option value="light" ${p.theme==='light'?'selected':''}>Светлая</option><option value="system" ${p.theme==='system'?'selected':''}>Как в системе</option></select></label><label class="check"><input id="profileSound" type="checkbox" ${p.sound_enabled?'checked':''}>Звуки новых сообщений</label><label class="check"><input id="profileNotifications" type="checkbox" ${p.notifications_enabled?'checked':''}>Уведомления</label><button class="primary">Сохранить</button><button id="blockedBtn" class="secondary" type="button">Заблокированные пользователи</button></form>`,()=>{$("profileUsername").oninput=()=>$("profileUsername").value=$("profileUsername").value.toLowerCase().replace(/[^a-z0-9_]/g,"");$("profileForm").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/me/profile",{method:"PATCH",body:{display_name:$("profileName").value,username:$("profileUsername").value,bio:$("profileBio").value,avatar_url:$("profileAvatar").value,theme:$("profileTheme").value,sound_enabled:$("profileSound").checked,notifications_enabled:$("profileNotifications").checked}});state.user=d.user;state.profile=d.profile;applyTheme(d.profile.theme);toast("Профиль сохранён");closeModal();await reloadChats()}catch(err){toast(err.message,"error")}};$("blockedBtn").onclick=openBlocked})}
    async function openBlocked(){try{const d=await api("/api/me/blocks");openModal("Заблокированные",`<div class="result-list">${(d.users||[]).map(u=>`<div class="result-row"><div class="avatar">${initial(u.display_name)}</div><div><div class="result-name">${escapeHtml(u.display_name||u.username)}</div><div class="result-sub">@${escapeHtml(u.username)}</div></div><button class="chip-btn" data-unblock="${escapeHtml(u.id)}">Разблокировать</button></div>`).join("")||'<div class="empty-list">Список пуст</div>'}</div>`,()=>document.querySelectorAll("[data-unblock]").forEach(b=>b.onclick=async()=>{await api(`/api/me/blocks/${encodeURIComponent(b.dataset.unblock)}`,{method:"DELETE",body:{}});openBlocked()}))}catch(err){toast(err.message,"error")}}
    function openReport(type,id){openModal("Жалоба",`<form id="reportForm" class="form-grid"><label>Причина<select id="reportReason"><option>Спам</option><option>Оскорбления</option><option>Мошенничество</option><option>Запрещённый контент</option><option>Другое</option></select></label><label>Описание<textarea id="reportDetails" maxlength="1000"></textarea></label><button class="primary">Отправить</button></form>`,()=>{$("reportForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/reports",{method:"POST",body:{target_type:type,target_id:id,reason:$("reportReason").value,details:$("reportDetails").value}});toast("Жалоба отправлена");closeModal()}catch(err){toast(err.message,"error")}}})}
    $("adminBtn").onclick=()=>openAdmin();
    async function openAdmin(q=""){try{const d=await api(`/api/admin/overview?q=${encodeURIComponent(q)}`);openModal("Администрирование",`<div class="stat-grid"><div class="stat"><b>${d.stats.users}</b><span>пользователей</span></div><div class="stat"><b>${d.stats.chats}</b><span>чатов</span></div><div class="stat"><b>${d.stats.messages}</b><span>сообщений</span></div><div class="stat"><b>${d.stats.open_reports}</b><span>жалоб</span></div></div><div class="section"><div class="inline"><input id="adminSearch" class="grow" value="${escapeHtml(q)}" placeholder="Поиск пользователей"><button id="adminSearchBtn" class="secondary">Найти</button></div><h3>Пользователи</h3><div class="admin-table">${(d.users||[]).map(u=>`<div class="admin-row"><div class="admin-row-head"><strong>${escapeHtml(u.display_name||u.username)}</strong><small>@${escapeHtml(u.username)} · ${escapeHtml(u.email||"")}</small></div><div class="admin-actions"><select data-admin-status="${escapeHtml(u.id)}"><option value="active" ${u.status==='active'?'selected':''}>Активен</option><option value="suspended" ${u.status==='suspended'?'selected':''}>Заблокирован</option><option value="deleted" ${u.status==='deleted'?'selected':''}>Удалён</option></select><select data-admin-role="${escapeHtml(u.id)}"><option value="user" ${u.role==='user'?'selected':''}>Пользователь</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Модератор</option><option value="admin" ${u.role==='admin'?'selected':''}>Админ</option><option value="owner" ${u.role==='owner'?'selected':''}>Владелец</option></select><button class="secondary" data-admin-save="${escapeHtml(u.id)}">Сохранить</button></div></div>`).join("")}</div></div><div class="section"><h3>Жалобы</h3><div class="admin-table">${(d.reports||[]).map(r=>`<div class="admin-row"><div class="admin-row-head"><strong>${escapeHtml(r.reason)}</strong><small>${escapeHtml(r.target_type)} · ${escapeHtml(r.status)}</small></div><p>${escapeHtml(r.details||"")}</p><div class="admin-actions"><select data-report-status="${escapeHtml(r.id)}"><option value="open" ${r.status==='open'?'selected':''}>Открыта</option><option value="reviewing" ${r.status==='reviewing'?'selected':''}>Проверяется</option><option value="resolved" ${r.status==='resolved'?'selected':''}>Решена</option><option value="rejected" ${r.status==='rejected'?'selected':''}>Отклонена</option></select><button class="secondary" data-report-save="${escapeHtml(r.id)}">Сохранить</button></div></div>`).join("")||'<div class="empty-list">Жалоб нет</div>'}</div></div>`,()=>{$("adminSearchBtn").onclick=()=>openAdmin($("adminSearch").value);document.querySelectorAll("[data-admin-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.adminSave;const status=document.querySelector(`[data-admin-status="${CSS.escape(id)}"]`).value;const role=document.querySelector(`[data-admin-role="${CSS.escape(id)}"]`).value;try{await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:"PATCH",body:{status,role}});toast("Пользователь обновлён")}catch(err){toast(err.message,"error")}});document.querySelectorAll("[data-report-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.reportSave;const status=document.querySelector(`[data-report-status="${CSS.escape(id)}"]`).value;try{await api(`/api/admin/reports/${encodeURIComponent(id)}`,{method:"PATCH",body:{status,resolution:"Обработано администратором"}});toast("Жалоба обновлена")}catch(err){toast(err.message,"error")}})})}catch(err){toast(err.message,"error")}}
    function openModal(title,html,ready){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modalFoot").classList.add("hidden");$("modal").classList.remove("hidden");setTimeout(()=>ready?.(),0)}function closeModal(){$("modal").classList.add("hidden");$("modalBody").innerHTML=""}$("modalClose").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
    $("logoutBtn").onclick=async()=>{clearInterval(state.poll);try{await api("/api/auth/logout",{method:"POST",body:{}})}catch{}clearSession();location.reload()};
    async function restore(){const saved=JSON.parse(localStorage.getItem("wavero_session")||"null");if(!saved)return;if(saved.expires_at<Date.now()+30000){state.refreshToken=saved.refresh_token||null;state.authProvider=saved.auth_provider||null;if(!await refreshSession())return}else saveSession(saved);try{await enterApp()}catch{clearSession()}}
    (async()=>{const handled=await completeYandexLogin();if(!handled)await restore()})();
  </script>
